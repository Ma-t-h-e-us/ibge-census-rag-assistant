[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibge-census-rag-assistant"
version = "0.1.0"
description = "Source-grounded RAG assistant for the 2022 Brazilian Census"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
